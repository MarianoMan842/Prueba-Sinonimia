name: Generar Sitemap Automático

on:
  push:
    branches:
      - main 

# ESTA SECCIÓN NUEVA LE DICE AL BOT QUE TIENE PERMISO DE ESCRIBIR
permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate a sitemap
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Generar el archivo sitemap.xml
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: https://marianoman842.github.io/Prueba-Sinonimia/ # URL corregida para tu proyecto

    - name: Hacer commit y push del sitemap generado
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add sitemap.xml
        git diff-index --quiet HEAD || git commit -m "Automated sitemap update"
        git push
